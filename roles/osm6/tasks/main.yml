- name: osm6 | set vars
  set_fact:
    key_value: serial_data
    osm6_base_dir: /opt/osm6/osm6
    osm6_build_dir: /opt/osm6/build

- name: osm6 | set vars
  set_fact:
    key_value: serial_data
    serial_executable_dir: "{{osm6_base_dir}}/binaries/aarch64"

