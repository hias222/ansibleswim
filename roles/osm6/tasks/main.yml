- name: osm6 | disable service serial
  become: true
  service:
    name: osm6
    enabled: no
  ignore_errors: true

- name: osm6 | disable service serial
  become: true 
  shell: rm -f /etc/systemd/system/osm6.service
  ignore_errors: true

- name: "osm6 | reboot"
  become: true
  reboot:
    msg: "Reboot initiated by Ansible"
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: whoami
  ignore_errors: true

- name: "osm6 | install service "
  become: true
  template:
    src: osm6.service
    dest: /lib/systemd/system/osm6.service
    owner: root
    group: root
    mode: '0644'
  when: not use_ftdi_serial|bool

- name: "osm6 | install service for ftdi "
  become: true
  template:
    src: osm6_ftdi.service
    dest: /lib/systemd/system/osm6.service
    owner: root
    group: root
    mode: '0644'
  when: use_ftdi_serial|bool

- name: "osm6 | install service for linux base "
  become: true
  template:
    src: osm6_linux_ftdi.service
    dest: /lib/systemd/system/osm6.service
    owner: root
    group: root
    mode: '0644'
  when:
      - ansible_facts['architecture'] == "x86_64"
      - ansible_facts['system'] == "Linux"

- name: "osm6 | serialsw"
  import_role: 
    name: osm6sw

- name: osm6 | Enable service osm6
  become: true
  service:
    name: osm6
    enabled: yes

- name: osm6 | Enable service serial
  become: true
  service:
    name: osm6
    state: started

